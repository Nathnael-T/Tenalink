services:
  # Frontend service (Vite React app served via Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tenalink-frontend
    ports:
      - "3000:80"
    environment:
      - NGINX_HOST=frontend
      - NGINX_PORT=80
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend service (Spring Boot gateway and microservices)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tenalink-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      # Add service-specific configs here:
      # - SPRING_PROFILES_ACTIVE=docker
      # - DATABASE_URL=jdbc:postgresql://postgres:5432/tenalink
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL database (placeholder for microservices)
  postgres:
    image: postgres:16-alpine
    container_name: tenalink-postgres
    environment:
      - POSTGRES_DB=tenalink
      - POSTGRES_USER=tenalink
      - POSTGRES_PASSWORD=changeme  # ⚠️ Change in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tenalink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenalink"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  tenalink-network:
    driver: bridge
