services:
  postgres:
    image: postgres:16-alpine
    container_name: tenalink-postgres
    environment:
      POSTGRES_DB: tenalink
      POSTGRES_USER: tenalink
      POSTGRES_PASSWORD: "2001"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tenalink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenalink"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tenalink-backend
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenalink-network
    restart: unless-stopped
    command: ["mvn", "-pl", "gateway-service", "spring-boot:run"]

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: tenalink-frontend
    ports:
      - "3000:5173"
      - "5173:5173"
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/public:/app/public
    environment:
      - VITE_HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tenalink-network
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
    driver: local

networks:
  tenalink-network:
    driver: bridge
