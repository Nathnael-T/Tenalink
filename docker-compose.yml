services:
  # Frontend service (Vite React app with hot reload)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: tenalink-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/public:/app/public
    environment:
      - VITE_HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - path: ./Frontend/src
          action: sync
          target: /app/src
        - path: ./Frontend/public
          action: sync
          target: /app/public

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: tenalink-postgres
    environment:
      - POSTGRES_DB=tenalink
      - POSTGRES_USER=tenalink
      - POSTGRES_PASSWORD=2001
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tenalink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenalink"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Auth service
  auth-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-auth-service
    ports:
      - "8081:8081"
    volumes:
      - ./Backend/auth-service/src:/app/auth-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "auth-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8081"]
    develop:
      watch:
        - path: ./Backend/auth-service/src
          action: sync
          target: /app/auth-service/src

  # User service
  user-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-user-service
    ports:
      - "8082:8082"
    volumes:
      - ./Backend/user-service/src:/app/user-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "user-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8082"]
    develop:
      watch:
        - path: ./Backend/user-service/src
          action: sync
          target: /app/user-service/src

  # Pharmacy service
  pharmacy-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-pharmacy-service
    ports:
      - "8085:8085"
    volumes:
      - ./Backend/pharmacy-service/src:/app/pharmacy-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "pharmacy-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8085"]
    develop:
      watch:
        - path: ./Backend/pharmacy-service/src
          action: sync
          target: /app/pharmacy-service/src

  # Medical records service
  medical-records-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-medical-records-service
    ports:
      - "8086:8086"
    volumes:
      - ./Backend/medical-records-service/src:/app/medical-records-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "medical-records-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8086"]
    develop:
      watch:
        - path: ./Backend/medical-records-service/src
          action: sync
          target: /app/medical-records-service/src

  # Admin service
  admin-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-admin-service
    ports:
      - "8087:8087"
    volumes:
      - ./Backend/admin-service/src:/app/admin-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "admin-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8087"]
    develop:
      watch:
        - path: ./Backend/admin-service/src
          action: sync
          target: /app/admin-service/src

  # Hospital service
  hospital-service:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-hospital-service
    ports:
      - "8088:8088"
    volumes:
      - ./Backend/hospital-service/src:/app/hospital-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      - postgres
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["mvn", "-pl", "hospital-service", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dserver.port=8088"]
    develop:
      watch:
        - path: ./Backend/hospital-service/src
          action: sync
          target: /app/hospital-service/src

  # Gateway service (API Gateway)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: tenalink-backend
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./Backend/gateway-service/src:/app/gateway-service/src
      - m2-cache:/root/.m2
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - MAVEN_OPTS=-Dspotless.check.skip=true
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      pharmacy-service:
        condition: service_started
      medical-records-service:
        condition: service_started
      admin-service:
        condition: service_started
      hospital-service:
        condition: service_started
    networks:
      - tenalink-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["mvn", "-pl", "gateway-service", "spring-boot:run"]
    develop:
      watch:
        - path: ./Backend/gateway-service/src
          action: sync
          target: /app/gateway-service/src

volumes:
  postgres_data:
    driver: local
  m2-cache:
    driver: local

networks:
  tenalink-network:
    driver: bridge
